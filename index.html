<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Zero-Knowledge Drive</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <header class="navbar">
        <div class="logo">ZK-Drive</div>
        <div class="user-controls">
            <button id="navAuthBtn" class="btn-primary">Entrar</button>
            <div id="userInfo" style="display: none;">
                <span id="userEmailDisplay"></span>
                <button id="navLogoutBtn" class="btn-danger">Sair</button>
            </div>
        </div>
    </header>

    <main id="mainContent">
        <div id="unauthenticatedView" class="view-state active">
            <div class="lock-container">
                <h2>Acesso Restrito</h2>
                <p>Faça login para carregar o conteúdo do seu cofre.</p>
            </div>
        </div>
        <div id="authenticatedView" class="view-state">
            <div class="dashboard-header"
                style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
                <h2>Meu Cofre</h2>
                <span id="privateKeyStatusBadge"
                    style="background: var(--success); color: #111; padding: 5px 10px; border-radius: 15px; font-size: 0.8em; font-weight: bold;">🔐
                    Chave Privada Ativa</span>
            </div>

            <!-- Painel de Upload -->
            <div class="upload-panel"
                style="background: var(--bg-surface); padding: 20px; border-radius: 8px; border: 1px dashed var(--border); margin-bottom: 30px;">
                <h3>Fazer Upload de Arquivo</h3>
                <input type="file" id="fileInput" style="margin-bottom: 15px;">
                <button id="btnUpload" class="btn-primary">Criptografar e Enviar</button>
                <p id="uploadStatus" class="message" style="color: var(--accent);"></p>
            </div>

            <!-- Lista de Arquivos -->
            <h3>Meus Arquivos</h3>
            <div id="fileGrid"
                style="display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 15px; margin-top: 15px;">
                <!-- Os arquivos aparecerão aqui -->
            </div>
        </div>
    </main>

    <div id="authModal" class="modal-overlay">
        <div class="modal-content">
            <button id="closeModalBtn" class="close-btn">&times;</button>
            <h2 id="modalTitle">Login</h2>

            <div class="auth-toggle">
                <button id="toggleLoginMode" class="active">Entrar</button>
                <button id="toggleRegisterMode">Registrar</button>
            </div>

            <form id="authForm">
                <input type="email" id="authEmail" placeholder="E-mail" required>
                <input type="password" id="authPassword" placeholder="Palavra-passe" required>
                <button type="submit" id="authSubmitBtn" class="btn-primary">Entrar no Cofre</button>
            </form>
            <p id="authMessage" class="message"></p>
        </div>
    </div>

    <script type="module" src="dashboard.js"></script>
    <script type="module" src="auth.js"></script>
</body>

</html>
